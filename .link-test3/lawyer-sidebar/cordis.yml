# lawyer-dsh 的 patch overlay（配合 `pnpm dsh web --patch` 使用）。
# 前置：先把两个插件包安装进 web profile，使 name 可从 profile 目录解析：
#   pnpm --dir d:/codes/deepseek-harness dsh plugin --profile web add file:///d:/codes/lawyer-dsh/plugins/lawyer-sidebar
#   pnpm --dir d:/codes/deepseek-harness dsh plugin --profile web add file:///d:/codes/lawyer-dsh/plugins/lawyer-tools
# 并部署 lawyer preset（详见项目根 debug-web.cmd，一键完成上述步骤）：
#   xcopy /E /I /Y d:\codes\lawyer-dsh\profiles\lawyer "%USERPROFILE%\.dsh\.agent-presets\lawyer"
# 启动：
#   pnpm --dir d:/codes/deepseek-harness dsh web --patch d:/codes/lawyer-dsh/plugins/lawyer-sidebar/cordis.yml
- insert:
  - id: lawyer-sidebar
    name: lawyer-sidebar
  # Host 工具插件：把 skills/ 目录下的技能注册进技能注册表（全局层）。
  # skillsDir 打包（M5）时改为安装目录下的 skills 路径。
  - id: lawyer-tools
    name: lawyer-tools
    config:
      skillsDir: d:/codes/lawyer-dsh/skills
