name: 问题反馈
description: 功能异常、报错或界面不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提 Issue 前请先扫一遍 [`docs/常见问题.md`](../../blob/master/docs/常见问题.md)。
        贴日志前请脱敏，**不要把 API Key 贴进来**（贴了请立即去平台吊销重签）。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 安装包文件名或侧栏显示的版本号
      placeholder: "0.80"
    validations:
      required: true

  - type: dropdown
    id: flavor
    attributes:
      label: 使用形态
      options:
        - 安装包版（exe）
        - 插件版（装进自己的 dsh）
        - 源码调试（debug-web.cmd）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 看到了什么？期望看到什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 点右侧栏「合同审核」
        2. 选乙方立场、严格审核、上传 xxx.docx
        3. 点「开始」
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（已脱敏）
      description: |
        安装包版：`%APPDATA%\lawyer-workbench\logs\dsh-web.log`
        插件版 / 源码调试：`%USERPROFILE%\.dsh` 相关日志或仓库根 `.dsh-web.log`
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 日志与截图里不含 API Key 等敏感信息
          required: true
        - label: 已看过 docs/常见问题.md
          required: false
