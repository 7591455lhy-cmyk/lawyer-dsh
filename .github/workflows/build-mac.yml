name: build-mac

# 出 macOS dmg（Apple Silicon 与 Intel 各一份）。
#
# 与 Windows 链路的关系：插件产物 lib/ 已入库，所以这里**不重新构建插件**——
# 出包前务必确认工作区里 plugins/*/lib 的更新都已提交，否则包里会是旧产物。
# runtime 是平台相关的（Node 二进制、koffi 原生模块、pnpm 装配结果），必须在
# macOS 上用 scripts/prepare-runtime.mjs 重新组装。
#
# 触发：手动 workflow_dispatch，或推送 tag app-mac-v*（此时会上传到 Release）。

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'dsh 版本'
        required: false
        default: '0.1.5-rc.2'
  push:
    tags:
      - 'app-mac-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DSH_VERSION: ${{ inputs.dsh_version || '0.1.5-rc.2' }}
      # 未签名出包：跳过证书发现，避免 electron-builder 去找不存在的身份
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: 缓存（npm / Electron / 下载缓存）
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            packaging/.cache
          key: mac-${{ matrix.arch }}-${{ hashFiles('packaging/package.json') }}

      - name: 克隆中国法语料
        run: git clone --depth 1 https://github.com/CSlawyer1985/claude-for-legal-ZH.git "$RUNNER_TEMP/claude-for-legal-ZH"

      - name: 组装 runtime（${{ matrix.arch }}）
        working-directory: packaging
        run: |
          node scripts/prepare-runtime.mjs \
            --platform darwin \
            --arch ${{ matrix.arch }} \
            --dsh-version "$DSH_VERSION" \
            --legal-zh "$RUNNER_TEMP/claude-for-legal-ZH"

      - name: 生成 icon.icns
        working-directory: packaging/build
        run: |
          set -euo pipefail
          rm -rf icon.iconset icon.icns
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" icon.png --out "icon.iconset/icon_${s}x${s}.png" > /dev/null
            d=$((s * 2))
            sips -z "$d" "$d" icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset
          test -s icon.icns || { echo "::error::icon.icns 生成失败"; exit 1; }
          ls -l icon.icns

      - name: 安装打包依赖
        working-directory: packaging
        run: npm install

      - name: 清理旧产物
        working-directory: packaging
        run: rm -rf dist

      - name: 出 dmg（${{ matrix.arch }}）
        working-directory: packaging
        run: npx electron-builder --mac dmg --${{ matrix.arch }}

      - name: 自检产物
        working-directory: packaging
        run: node .check-mac-pkg.mjs --arch ${{ matrix.arch }}

      # 用包内的 Node 与 dsh 真起一次服务。x64 构建跑在 arm64 runner 上需要
      # Rosetta，不一定可用，所以软失败（出包结果不受影响）。
      - name: 冒烟（启动包内 dsh web）
        continue-on-error: ${{ matrix.arch != 'arm64' }}
        run: |
          set -uo pipefail
          runtime="$GITHUB_WORKSPACE/packaging/runtime"
          log="$RUNNER_TEMP/dsh-web.log"
          export DSH_HOME="$RUNNER_TEMP/dsh-smoke-home"
          rm -rf "$DSH_HOME"
          nohup "$runtime/node/bin/node" \
            "$runtime/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" web --no-open > "$log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dsh.pid"

          launch=""
          for i in $(seq 1 180); do
            launch=$(grep -o 'dsh web: http[^ ]*' "$log" 2>/dev/null | head -n 1 | sed 's/^dsh web: //')
            [ -n "$launch" ] && { echo "服务就绪（${i}s）"; break; }
            sleep 1
          done
          if [ -z "$launch" ]; then
            echo "::error::未从日志解析到带 token 的启动 URL"
            tail -n 100 "$log"; exit 1
          fi
          # 0.1.5 起根路径要 token：期望 303 + Set-Cookie
          curl -sS -i "$launch" -o "$RUNNER_TEMP/login.txt"
          status=$(head -n 1 "$RUNNER_TEMP/login.txt" | tr -d '\r' | awk '{print $2}')
          if [ "$status" != "303" ]; then
            echo "::error::带 token 请求根路径返回 $status（期望 303）"; exit 1
          fi
          # 静态资源不走鉴权
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3080/plugins/lawyer-sidebar/client.js")
          if [ "$code" != "200" ]; then echo "::error::client.js 返回 $code"; exit 1; fi
          echo "冒烟通过：dsh web 起得来，插件静态资源可访问"

      - name: 停止服务
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dsh.pid" ]; then kill "$(cat "$RUNNER_TEMP/dsh.pid")" 2>/dev/null || true; fi
          pkill -f "dsh web" 2>/dev/null || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-${{ matrix.arch }}
          path: packaging/dist/*.dmg
          if-no-files-found: error
          overwrite: true

      - name: 上传 Release 资产
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" packaging/dist/*.dmg --clobber
